[package]
name = "rill"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
arc-swap = "=1.9.3"
async-trait = "0.1"
bytes = "=1.12.1"
clap = { version = "4.6", features = ["derive"] }
httpdate = "=1.0.3"
kdl = { version = "=6.7.1", default-features = false, features = ["span"] }
nix = { version = "=0.31.3", features = ["fs", "user", "inotify", "dir"] }
openssl = "0.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
socket2 = "0.6"
pingora = { version = "=0.9.0", default-features = false, features = ["openssl", "proxy"] }
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
all = { level = "warn", priority = -1 }

cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[dev-dependencies]
h2 = "=0.4.20"
http = "=1.5.0"
regex = "=1.13.1"
regex-syntax = "=0.8.11"
