[package]
name = "rill-grpc-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
async-trait = "=0.1.92"
bytes = "=1.12.1"
http = "=1.5.0"
openssl = "=0.10.82"
pingora = { version = "=0.9.0", default-features = false, features = ["openssl", "proxy"] }
prost = "=0.14.4"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = { version = "=0.14.9", features = ["tls-ring"] }
tonic-prost = "=0.14.9"
tower = { version = "=0.5.3", features = ["util"] }
